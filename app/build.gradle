plugins {
    id 'com.android.application'
}

android {
    namespace 'com.huntergames.racing'
    compileSdk 34

    defaultConfig {
        applicationId 'com.huntergames.racing'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Web kaynaklarını kopyalamadan Android APK içine dahil eder.
    sourceSets {
        main {
            assets.srcDirs += ['../web']
        }
    }
}
