name: HUNTER RACING - APK OLUSTUR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Kaynak dosyalari indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android 35 platformunu kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Node 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Oyun testlerini calistir
        run: node tests/smoke.js

      - name: APK derle
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK dosyasini kontrol et
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Icinde yalnizca app-debug.apk bulunan ZIP olustur
        uses: actions/upload-artifact@v4
        with:
          name: HUNTER-RACING-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
